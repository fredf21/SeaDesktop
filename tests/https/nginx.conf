# ════════════════════════════════════════════════════════════════
# tests/https/nginx.conf
#
# Configuration nginx minimale pour tester SeaUI Remote en HTTPS.
# Le but n'est pas d'avoir une config production-grade, mais de
# valider que la chaine SeaUI → HTTPS → reverse proxy → backend
# fonctionne bout-en-bout avec un certificat auto-signe.
#
# Routes :
#   /admin/*  → backend service_a (port 8080 dans le reseau Docker)
#   /auth/*   → service_a
#   /health   → service_a
#   /*        → service_a (catch-all)
#
# Cycle de vie :
#   Lancement : docker compose -f docker-compose.https.yml up -d
#   Test curl : curl -k https://localhost/health
#   Arret     : docker compose -f docker-compose.https.yml down
# ════════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    # Resolveur DNS du reseau Docker (necessaire pour le proxy_pass
    # vers le nom de service Docker au lieu d'une IP statique).
    resolver 127.0.0.11 valid=30s;

    # Log d'acces au format etendu pour debugging.
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent" '
                    'upstream=$upstream_addr response_time=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ───────────────────────────────────────────────────────────
    # Redirection HTTP → HTTPS
    # ───────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ───────────────────────────────────────────────────────────
    # Reverse proxy HTTPS
    # ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        # Certificat auto-signe genere par tests/https/.
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Profil TLS moderne : TLS 1.2+, cipher suites raisonnables.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Timeout permissif pour les operations admin qui peuvent
        # etre longues (read/write YAML, restart, etc.).
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        location / {
            # Le hostname "service_a" est resolu par le DNS interne
            # de Docker (le service est sur le meme network bridge).
            proxy_pass http://service_a:8080;

            # En-tetes standards de reverse proxy. SeaUI / le backend
            # peuvent les ignorer mais ils sont la bonne pratique.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Le backend Seastar peut renvoyer des reponses en
            # streaming (logs, etc.) — on desactive le buffering
            # pour ne pas introduire de delai.
            proxy_buffering off;
        }
    }
}
